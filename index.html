<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Management Auth</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #111827;
        --accent: #38bdf8;
        --accent-2: #8b5cf6;
        --text: #f8fafc;
        --muted: #94a3b8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #1e293b);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(100%, 440px);
        background: rgba(17, 24, 39, 0.95);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 20px 45px rgba(0,0,0,0.35);
      }
      h1 { margin: 0 0 8px; font-size: 1.8rem; }
      p { color: var(--muted); line-height: 1.5; }
      .tabs { display: flex; gap: 10px; margin: 20px 0; }
      .tabs button {
        flex: 1;
        border: 0;
        padding: 10px;
        border-radius: 999px;
        cursor: pointer;
        background: #334155;
        color: var(--text);
      }
      .tabs button.active { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
      form { display: none; flex-direction: column; gap: 12px; }
      form.active { display: flex; }
      input {
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid #475569;
        background: #020617;
        color: var(--text);
      }
      button[type="submit"] {
        border: 0;
        border-radius: 12px;
        padding: 12px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        color: white;
        font-weight: bold;
        cursor: pointer;
      }
      .message {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #1e293b;
        color: #cbd5e1;
        display: none;
      }
      .dashboard {
        display: none;
        flex-direction: column;
        gap: 14px;
      }
      .dashboard.active { display: flex; }
      .pill { display: inline-block; padding: 6px 10px; border-radius: 999px; background: #1d4ed8; color: white; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="authView">
        <h1>Inventory Management</h1>
        <p>Create an account or sign in to manage your inventory.</p>
        <div class="tabs">
          <button class="active" data-target="loginForm">Login</button>
          <button data-target="registerForm">Register</button>
        </div>

        <form id="loginForm" class="active">
          <input id="loginEmail" type="email" placeholder="Email" required />
          <input id="loginPassword" type="password" placeholder="Password" required />
          <button type="submit">Login</button>
        </form>

        <form id="registerForm">
          <input id="registerName" type="text" placeholder="Full Name" required />
          <input id="registerEmail" type="email" placeholder="Email" required />
          <input id="registerPassword" type="password" placeholder="Password" required />
          <button type="submit">Create Account</button>
        </form>

        <div id="message" class="message"></div>
      </div>

      <div id="dashboard" class="dashboard">
        <span class="pill">Authenticated</span>
        <h2 id="welcomeName">Welcome</h2>
        <p id="welcomeEmail"></p>
        <button id="logoutButton" type="button">Logout</button>
      </div>
    </div>

    <script>
      const apiBase = window.location.origin;
      const authView = document.getElementById("authView");
      const dashboard = document.getElementById("dashboard");
      const messageBox = document.getElementById("message");

      function showMessage(text, isError = false) {
        messageBox.textContent = text;
        messageBox.style.display = "block";
        messageBox.style.background = isError ? "#7f1d1d" : "#1e293b";
      }

      async function checkSession() {
        const token = localStorage.getItem("token");
        if (!token) return;

        try {
          const response = await fetch(`${apiBase}/api/auth/me`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await response.json();
          if (response.ok && data.user) {
            showDashboard(data.user);
          } else {
            localStorage.removeItem("token");
          }
        } catch (error) {
          console.error(error);
        }
      }

      function showDashboard(user) {
        authView.style.display = "none";
        dashboard.classList.add("active");
        document.getElementById("welcomeName").textContent = `Welcome, ${user.name}`;
        document.getElementById("welcomeEmail").textContent = user.email;
      }

      function showAuth() {
        authView.style.display = "block";
        dashboard.classList.remove("active");
      }

      document.querySelectorAll(".tabs button").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".tabs button").forEach((btn) => btn.classList.remove("active"));
          button.classList.add("active");
          document.querySelectorAll("form").forEach((form) => form.classList.remove("active"));
          document.getElementById(button.dataset.target).classList.add("active");
        });
      });

      document.getElementById("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        try {
          const response = await fetch(`${apiBase}/api/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.message || "Login failed");
          localStorage.setItem("token", data.token);
          showDashboard(data.user);
          showMessage("Login successful");
        } catch (error) {
          showMessage(error.message, true);
        }
      });

      document.getElementById("registerForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const name = document.getElementById("registerName").value;
        const email = document.getElementById("registerEmail").value;
        const password = document.getElementById("registerPassword").value;

        try {
          const response = await fetch(`${apiBase}/api/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, password }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.message || "Registration failed");
          localStorage.setItem("token", data.token);
          showDashboard(data.user);
          showMessage("Registration successful");
        } catch (error) {
          showMessage(error.message, true);
        }
      });

      document.getElementById("logoutButton").addEventListener("click", () => {
        localStorage.removeItem("token");
        showAuth();
      });

      checkSession();
    </script>
  </body>
</html>
